# Inside your existing HTTPS server { ... } block.
# The app then calls https://your-domain/refraction/v1/path-profiles?lat=..&lon=..
location /refraction/ {
    proxy_pass http://127.0.0.1:8787/;
    proxy_set_header Host $host;
    proxy_read_timeout 120s;    # a first /v1/horizon vantage search can take ~10 s
}
